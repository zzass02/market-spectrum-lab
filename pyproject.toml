[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-spectrum-lab"
version = "0.1.0"
description = "Market time-series analysis across time, frequency, and time-frequency domains."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]